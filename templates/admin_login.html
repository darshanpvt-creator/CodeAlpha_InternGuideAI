<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | InternGuide AI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #101827;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 390px;
            padding: 32px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #1e293b;
        }
        h1 { margin-top: 0; font-size: 25px; }
        p { color: #cbd5e1; line-height: 1.5; }
        label { display: block; margin: 22px 0 8px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error { color: #fca5a5; margin-top: 14px; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>InternGuide AI</h1>
        <p>Administrator login</p>

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="password">Admin password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                autofocus
            >
            <button type="submit">Sign in</button>
        </form>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}
    </main>
</body>
</html>
